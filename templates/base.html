<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>{% block title %}صندوق شركة عزم الشرق{% endblock %}</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/static/icon.svg"><link rel="stylesheet" href="/static/style.css">
<script>
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js'))}
function delok(){return confirm('هل أنت متأكد من الحذف؟')}
async function sharePDF(){
 const f=document.querySelector('#from')?.value||'', t=document.querySelector('#to')?.value||'';
 const url=`/statement.pdf?from=${encodeURIComponent(f)}&to=${encodeURIComponent(t)}`;
 try{
  const res=await fetch(url,{credentials:'same-origin'}), blob=await res.blob();
  const file=new File([blob],'Azm_Cashbox.pdf',{type:'application/pdf'});
  if(navigator.canShare && navigator.canShare({files:[file]})){await navigator.share({title:'كشف حساب صندوق عزم الشرق',files:[file]});}
  else{window.location.href=url}
 }catch(e){window.location.href=url}
}
</script></head><body>
<header><a class="brand" href="/"><span class="logo">ع</span><span><b>شركة عزم الشرق</b><small>نظام الصندوق</small></span></a>
{% if current_user %}<div class="userbox"><span>{{ current_user.full_name }}</span>{% if current_user.role=="ADMIN" %}<a href="/users">المستخدمون</a>{% endif %}
<form method="post" action="/logout"><button>خروج</button></form></div>{% endif %}</header>
<main>{% with ms=get_flashed_messages(with_categories=true) %}{% for c,m in ms %}<div class="flash {{c}}">{{m}}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}</main></body></html>
