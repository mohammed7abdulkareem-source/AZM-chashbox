{% extends "base.html" %}{% block content %}<section class="formcard"><h1>خروج أموال</h1>
<div class="minibals"><div><span>USD الحالي</span><b>$ {{money(usd,"USD")}}</b></div><div><span>IQD الحالي</span><b>{{money(iqd,"IQD")}} د.ع</b></div></div>
<form method="post" class="entry"><label>قيمة المبلغ *<input type="number" step="0.01" min="0.01" name="amount" required></label>
<label>العملة *<select name="currency"><option value="USD">USD - دولار</option><option value="IQD">IQD - دينار عراقي</option></select></label>
<label>خروج إلى أي جهة *<input name="destination" required></label><label>من المستلم *<input name="receiver_name" required></label>
<label>التاريخ *<input type="date" name="transaction_date" value="{{today}}" required></label><label class="wide">ملاحظات<textarea name="notes" rows="3"></textarea></label>
<div class="wide buttons"><button class="btn red">حفظ العملية</button><a class="btn light" href="/">رجوع</a></div></form></section>{% endblock %}
